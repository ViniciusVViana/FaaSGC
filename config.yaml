# Configuração compartilhada pelas quatro baterias de testes.
# O endpoint é lido da variável GLOBUS_COMPUTE_ENDPOINT_ID.

payload_sizes_bytes:
  - 10240
  - 102400
  - 1048576
  - 5242880
  - 10485760

github:
  base_url: "https://raw.githubusercontent.com/ViniciusVViana/FaaSGC/refs/heads/main"
  paths:
    - "/data/arquivos_teste/10KB/arquivo_001.txt"
    - "/data/arquivos_teste/100KB/arquivo_001.txt"
    - "/data/arquivos_teste/1MB/arquivo_001.txt"
    - "/data/arquivos_teste/5MB/arquivo_001.txt"
    - "/data/arquivos_teste/10MB/arquivo_001.txt"

repetitions:
  bateria_1: 50
  bateria_2: 50
  bateria_3: 50
  bateria_4: 50

concurrency_levels:
  - 10
  - 100
  - 200

# Limite conservador para payloads in-band da Bateria 3.
# O Globus Compute limita a tarefa serializada a 10 MiB.
bateria_3_max_in_band_payload_bytes: 5242880

# Parâmetros usados pela Bateria 2 durante o acompanhamento das tarefas.
polling:
  interval_seconds: 2
  timeout_seconds: 3600

results_directory: "./resultados"
